# Azure PostgreSQL Flexible Server Configuration with AAD Authentication
# Database URL with Managed Identity authentication plugin
url=jdbc:postgresql://pg-lab-dd-14.postgres.database.azure.com:5432/postgres?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin

# Managed Identity (User-assigned managed identity)
user=jpwest-im

# Connection pool settings (optional)
connection.timeout=30000
login.timeout=30
socket.timeout=30

# SSL configuration
ssl=true
sslmode=require

# Azure authentication mode (for documentation purposes)
# The authentication will use Managed Identity through the Azure PostgreSQL Authentication Plugin